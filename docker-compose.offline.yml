services:
  db:
    image: mysql:5.6
    platform: linux/amd64
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in the private bundle.env}
      MYSQL_USER: ${DB_USER:?Set DB_USER in the private bundle.env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the private bundle.env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in the private bundle.env}
    volumes:
      - db-data:/var/lib/mysql
      - ./data:/docker-entrypoint-initdb.d:ro
    ports:
      - '3307:3306'

  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE in the private bundle.env}
    platform: linux/amd64
    ports:
      - '${WEB_PORT:-8000}:8000'
    volumes:
      - ./media:/app/static/media
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:?Set DB_NAME in the private bundle.env}
      - DB_USER=${DB_USER:?Set DB_USER in the private bundle.env}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in the private bundle.env}
      - SITE_TITLE=${SITE_TITLE:-PNW Moths}
      - SPECIES_SINGULAR=${SPECIES_SINGULAR:-moth}
      - SPECIES_PLURAL=${SPECIES_PLURAL:-moths}
      - ADMIN_USER=${ADMIN_USER:?Set ADMIN_USER in the private bundle.env}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the private bundle.env}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in the private bundle.env}
    depends_on:
      - db

volumes:
  db-data:

# -------------------------------------------------------
# The offline variant of docker-compose.yml, used by the bundle shipped to
# the curator. The only difference is that `web` names a pre-built image
# instead of building one.
#
# That difference is the whole point. Building the 2013 stack from source
# needs archive.debian.org and PyPI to keep serving Python 2.7 files, and
# needs them on a machine with no developer tools. The bundle's launcher
# loads images/pnwmoths-local-images.tar instead, so the only network the
# curator's machine ever needs is the one that downloaded the bundle.
#
# Rebuild and re-export the image with:
#   docker compose build web
#   docker tag pnwinsects-app-web:latest pnwinsects-local-web:1.1
#   docker save pnwinsects-local-web:1.1 mysql:5.6 -o images/pnwinsects-local-images.tar
# -------------------------------------------------------
